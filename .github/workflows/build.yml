# Rebuild README.md + site/ on every push, then publish site/ to Cloudflare Pages.
# Purely mechanical — it renders and ships, it doesn't decide anything.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate entries
        run: python3 build.py --check

      - name: Render
        run: python3 build.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- README.md site/; then
            echo "Nothing to publish."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md site/
          git commit -m "Rebuild hub [skip ci]"
          git push

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=keepstack --branch=main
